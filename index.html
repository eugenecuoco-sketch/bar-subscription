<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription vs. Partial Payment Modeler</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (Development versions for better error messaging) -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
    
    <!-- Prop Types -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
    
    <!-- Recharts -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.0/Recharts.min.js"></script>
    
    <!-- Babel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js"></script>

    <style>
        body { background-color: #f8fafc; }
        /* Error container styling */
        #error-container { display: none; padding: 20px; background: #fee2e2; color: #991b1b; border: 1px solid #ef4444; margin: 20px; border-radius: 8px; font-family: monospace; }
        /* Loader styling */
        #loading { font-family: system-ui, sans-serif; text-align: center; margin-top: 50px; color: #64748b; }
    </style>
</head>
<body>
    <div id="error-container"></div>
    <div id="root">
        <div id="loading">
            <h2 class="text-xl font-semibold">Loading Dashboard...</h2>
            <p class="text-sm mt-2">Please ensure you are connected to the internet to load libraries.</p>
        </div>
    </div>

    <!-- Error Handler Script -->
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            const container = document.getElementById('error-container');
            const loading = document.getElementById('loading');
            if (loading) loading.style.display = 'none';
            container.style.display = 'block';
            container.innerHTML = `<strong>Error:</strong> ${message}<br><small>Line: ${lineno}</small>`;
            console.error(error);
        };
    </script>

    <script type="text/babel">
        // Safety check for libraries
        if (!window.React || !window.ReactDOM || !window.Recharts) {
            throw new Error("One or more libraries failed to load. Please check your internet connection.");
        }

        const { useState, useMemo } = React;
        const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, Cell } = window.Recharts;

        // --- Icons ---
        const DollarSign = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" x2="12" y1="1" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        );
        const TrendingUp = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
        );
        const TrendingDown = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>
        );
        const AlertCircle = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
        );
        const CheckCircle = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        );

        // --- Data & Logic ---
        const HISTORICAL_DATA = {
            "0-6 Months": { avgValue: 1006.82, maxMonths: 6 },
            "7-12 Months": { avgValue: 1094.94, maxMonths: 12 },
            "13-18 Months": { avgValue: 849.02, maxMonths: 18 },
            "19-24 Months": { avgValue: 1008.67, maxMonths: 24 },
            "25-30 Months": { avgValue: 611.24, maxMonths: 30 },
            "31-36 Months": { avgValue: 1072.20, maxMonths: 36 },
        };

        const INITIAL_PRICING = {
            "0-6 Months": 200,
            "7-12 Months": 100,
            "13-18 Months": 55,
            "19-24 Months": 45,
            "25-30 Months": 35,
            "31-36 Months": 30,
        };

        const DOWN_PAYMENT = 20;

        const Card = ({ children, className = "" }) => (
            <div className={`bg-white rounded-lg shadow-sm border border-slate-200 ${className}`}>
                {children}
            </div>
        );

        const App = () => {
            const [pricing, setPricing] = useState(INITIAL_PRICING);

            const data = useMemo(() => {
                return Object.keys(HISTORICAL_DATA).map((cohort) => {
                    const historicalVal = HISTORICAL_DATA[cohort].avgValue;
                    const months = HISTORICAL_DATA[cohort].maxMonths;
                    const monthlyPrice = pricing[cohort];
                    
                    const subLTV = DOWN_PAYMENT + (monthlyPrice * months);
                    const diff = subLTV - historicalVal;
                    const isWinning = diff >= 0;

                    return {
                        name: cohort,
                        historical: historicalVal,
                        subscription: subLTV,
                        months,
                        monthlyPrice,
                        diff,
                        isWinning
                    };
                }).reverse();
            }, [pricing]);

            const handlePriceChange = (cohort, val) => {
                setPricing(prev => ({
                    ...prev,
                    [cohort]: Number(val)
                }));
            };

            return (
                <div className="min-h-screen bg-slate-50 p-4 md:p-8 font-sans text-slate-800">
                    <header className="mb-8 max-w-7xl mx-auto">
                        <h1 className="text-3xl font-bold text-slate-900">Subscription vs. Partial Payment Modeler</h1>
                        <p className="text-slate-500 mt-2 text-lg">
                            Validate the "Step-Up" pricing model against historical partial payment attrition.
                        </p>
                    </header>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 max-w-7xl mx-auto">
                        
                        {/* Control Panel */}
                        <div className="lg:col-span-4 space-y-6">
                            <Card className="p-6 sticky top-6">
                                <div className="flex items-center justify-between mb-4">
                                    <h2 className="text-xl font-semibold flex items-center gap-2">
                                        <DollarSign className="w-5 h-5 text-blue-600" />
                                        Pricing Inputs
                                    </h2>
                                    <span className="text-xs font-medium bg-blue-100 text-blue-800 px-2 py-1 rounded-full">+$20 Down</span>
                                </div>
                                
                                <div className="space-y-4">
                                    {Object.keys(HISTORICAL_DATA).reverse().map((cohort) => {
                                        const currentData = data.find(d => d.name === cohort);
                                        return (
                                            <div key={cohort} className="bg-slate-50 p-4 rounded-md border border-slate-100">
                                                <div className="flex justify-between items-center mb-2">
                                                    <label className="font-semibold text-sm text-slate-700">{cohort}</label>
                                                    <span className="text-xs text-slate-500">{HISTORICAL_DATA[cohort].maxMonths} mo term</span>
                                                </div>
                                                
                                                <div className="flex items-center gap-3">
                                                    <div className="relative flex-1">
                                                        <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">$</span>
                                                        <input
                                                            type="number"
                                                            value={pricing[cohort]}
                                                            onChange={(e) => handlePriceChange(cohort, e.target.value)}
                                                            className="w-full pl-7 pr-3 py-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                                                        />
                                                        <span className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs">/mo</span>
                                                    </div>
                                                    
                                                    <div className="w-8 flex justify-center">
                                                        {currentData.isWinning ? (
                                                            <TrendingUp className="w-5 h-5 text-emerald-500" />
                                                        ) : (
                                                            <TrendingDown className="w-5 h-5 text-rose-500" />
                                                        )}
                                                    </div>
                                                </div>
                                                
                                                <div className="mt-2 flex justify-between text-xs">
                                                    <span className="text-slate-500">Target: <span className="font-medium">${HISTORICAL_DATA[cohort].avgValue.toLocaleString(undefined, {maximumFractionDigits: 0})}</span></span>
                                                    <span className={`${currentData.isWinning ? 'text-emerald-600' : 'text-rose-600'} font-medium`}>
                                                        {currentData.isWinning ? '+' : ''}
                                                        ${currentData.diff.toLocaleString(undefined, {maximumFractionDigits: 0})}
                                                    </span>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </Card>
                        </div>

                        {/* Chart Panel */}
                        <div className="lg:col-span-8 space-y-6">
                            <Card className="p-6">
                                <h2 className="text-xl font-semibold mb-6">Lifetime Value (LTV) Comparison</h2>
                                <div className="h-[500px] w-full">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <BarChart
                                            data={data}
                                            margin={{ top: 20, right: 30, left: 20, bottom: 5 }}
                                            layout="vertical"
                                        >
                                            <CartesianGrid strokeDasharray="3 3" horizontal={false} stroke="#e2e8f0" />
                                            <XAxis type="number" unit="$" stroke="#64748b" />
                                            <YAxis dataKey="name" type="category" width={100} stroke="#64748b" fontSize={12} />
                                            <Tooltip 
                                                cursor={{fill: '#f1f5f9'}}
                                                contentStyle={{ borderRadius: '8px', border: 'none', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)' }}
                                                formatter={(value) => `$${value.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`}
                                            />
                                            <Legend wrapperStyle={{ paddingTop: '20px' }} />
                                            
                                            <Bar dataKey="historical" name="Historical Avg (Partial Pay)" fill="#94a3b8" radius={[0, 4, 4, 0]} barSize={20} />
                                            
                                            <Bar dataKey="subscription" name="Projected Subscription LTV" radius={[0, 4, 4, 0]} barSize={20}>
                                                {data.map((entry, index) => (
                                                    <Cell key={`cell-${index}`} fill={entry.isWinning ? '#10b981' : '#f43f5e'} />
                                                ))}
                                            </Bar>
                                        </BarChart>
                                    </ResponsiveContainer>
                                </div>
                            </Card>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {data.map((item) => (
                                    <Card key={item.name} className={`p-4 border-l-4 ${item.isWinning ? 'border-l-emerald-500' : 'border-l-rose-500'}`}>
                                        <div className="flex justify-between items-start">
                                            <div>
                                                <h3 className="font-bold text-slate-800">{item.name}</h3>
                                                <p className="text-xs text-slate-500 mt-1">
                                                    Input: ${item.monthlyPrice}/mo × {item.months} mo + $20
                                                </p>
                                            </div>
                                            {item.isWinning ? (
                                                <CheckCircle className="w-5 h-5 text-emerald-500" />
                                            ) : (
                                                <AlertCircle className="w-5 h-5 text-rose-500" />
                                            )}
                                        </div>
                                        
                                        <div className="mt-4 flex items-end justify-between">
                                            <div>
                                                <div className="text-xs text-slate-500 uppercase tracking-wide">Historical</div>
                                                <div className="font-semibold text-slate-700">${item.historical.toLocaleString(undefined, {maximumFractionDigits: 2})}</div>
                                            </div>
                                            <div className="text-right">
                                                <div className="text-xs text-slate-500 uppercase tracking-wide">Projected</div>
                                                <div className="font-bold text-slate-900 text-lg">${item.subscription.toLocaleString(undefined, {maximumFractionDigits: 2})}</div>
                                            </div>
                                        </div>

                                        <div className={`mt-3 pt-3 border-t border-dashed border-slate-200 text-sm font-medium flex justify-between items-center ${item.isWinning ? 'text-emerald-700' : 'text-rose-700'}`}>
                                            <span>Revenue Impact:</span>
                                            <span>
                                                {item.diff > 0 ? '+' : ''}{item.diff.toLocaleString(undefined, {style: 'currency', currency: 'USD'})}
                                            </span>
                                        </div>
                                    </Card>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
